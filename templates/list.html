{% extends 'base.html' %}

{% block title %}GoTime{% endblock %}

{% block content %}

<p><a href="{{url_for('stage_exec')}}">Home</a></p>

	{% endfor %}

<h1>{{tasks.list_name}}</h1>
<ul>
{% for card in tasks.cards %}
<li>{{card.card_name}} {{card.category_id}}
<form action="{{url_for('modify_task',task_id=card.card_id)}}" method="POST">
			<input type="submit" name="complete" value="&check;" />
</form>
</li>
{% endfor %}
</ul>

<form action="{{url_for('new_task')}}" method="POST">
	<p>
	New task: 
		<input name="name" />
		<select name="context" id="context">
			{% for contextsel in contexts %}
			<option value="{{contextsel.category_id}}">{{contextsel.category_name}}</option>
			{% endfor %}
		</select>
		<input type="submit" />
		<input name="list_id" type="hidden" value="{{tasks.list_id}}" />
	</p>
</form>


{% endblock %}
